<section class="card h-100 text-center">
  <img [src]="`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${getPokemonId()}.png`"
    class="card-img-top" [alt]="pokemon()?.name">
  <div class="card-body">
    <h4 class="card-title text-capitalize">{{ pokemon()?.name }}</h4>
    <button type="button" class="btn btn-primary" (click)="emitPokemonClicked()">View detail</button>
  </div>
</section>
